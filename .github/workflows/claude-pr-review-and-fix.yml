name: Claude PR Review and Fix

# Manual-only: automatic triggers disabled deliberately.
# on:
#   pull_request:
#     types: [opened, synchronize, reopened]
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  review-and-fix:
    runs-on: ubuntu-latest
    # Pushing fixes back requires write access to the PR's head branch, which the
    # default GITHUB_TOKEN only has for PRs opened from a branch within this repo
    # (not from forks) — so this only works for PRs from branches within this repo.
    steps:
      - name: Resolve PR refs
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Error: Invalid PR_NUMBER '$PR_NUMBER'. It must be a positive integer."
            exit 1
          fi

          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefName,baseRefName,headRepository \
            --jq '"head_ref=\(.headRefName)\nbase_ref=\(.baseRefName)"' >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "claude-ai[bot]"
          git config user.email "claude-ai[bot]@users.noreply.github.com"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code review, auto-fix, and PR comment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          claude -p "You are reviewing pull request #$PR_NUMBER in this repository as an automated CI job. There is no human available to answer questions, so make reasonable decisions yourself and proceed.

          1. Inspect this PR's changes against the base branch: run 'git fetch origin $BASE_REF' then 'git diff origin/$BASE_REF...HEAD' to see what changed.
          2. Run 'npm run lint' and 'npm test' to check for lint errors, type errors, failing tests, or obvious bugs introduced by this PR.
          3. If lint/test errors or code bugs are found, fix them directly in the source code. Keep fixes minimal and scoped to the actual problems the PR introduced — do not refactor unrelated code or touch files outside the PR's diff unless a fix requires it.
          4. If you made any code fixes, stage them, commit with the message 'fix(ci): auto-fix PR issues via Claude AI', and push the commit to this branch with 'git push origin HEAD:$HEAD_REF'. If no fixes were needed, skip committing.
          5. Regardless of outcome, post one summary comment on the pull request using 'gh pr comment $PR_NUMBER --body \"...\"' covering: what you inspected (diff scope, lint, tests), what issues were found (if any), what was fixed and committed (if anything), and a closing note asking a human reviewer to double-check the changes." \
            --allowedTools "Bash,Read,Edit,Write" \
            --dangerously-skip-permissions
